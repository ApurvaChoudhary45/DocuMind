version: "3.9"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    
    depends_on:
      - redis
  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"
  
  qdrant:
    image: qdrant/qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage: